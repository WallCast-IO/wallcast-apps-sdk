<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WallCast app simulator</title>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#262d36; --text:#e6edf3; --muted:#8b949e; --accent:#2f81f7; --ok:#3fb950; --warn:#d29922; --bad:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 Inter, system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); display:grid; grid-template-columns:1fr 340px; height:100vh; overflow:hidden; }
  main { display:flex; flex-direction:column; min-width:0; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; border-bottom:1px solid var(--line); }
  header h1 { font-size:15px; margin:0; font-weight:600; }
  header .meta { color:var(--muted); font-size:12px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:99px; background:#1f2937; color:var(--muted); }
  .badge.ok { background:rgba(63,185,80,.15); color:var(--ok); }
  .stage { flex:1; display:grid; place-items:center; padding:24px; min-height:0; }
  .screen { position:relative; background:#000; box-shadow:0 0 0 10px #1c2128, 0 20px 60px rgba(0,0,0,.6); border-radius:4px; overflow:hidden; }
  .screen iframe { position:absolute; inset:0; border:0; transform-origin:0 0; background:transparent; }
  .screen .cover { position:absolute; inset:0; display:grid; place-items:center; color:var(--muted); font-size:13px; transition:opacity .3s; pointer-events:none; }
  aside { border-left:1px solid var(--line); background:var(--panel); overflow:auto; padding:14px 16px 40px; }
  aside h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:18px 0 8px; }
  label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
  input, select, textarea { width:100%; background:#0d1117; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 9px; font:inherit; }
  input[type=checkbox] { width:auto; }
  input[type=color] { padding:2px; height:34px; }
  textarea { min-height:70px; font-family:ui-monospace, Menlo, monospace; font-size:12px; }
  button { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:7px 12px; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { flex:1; }
  .hint { color:var(--muted); font-size:12px; }
  .log { font-family:ui-monospace, Menlo, monospace; font-size:11.5px; max-height:220px; overflow:auto; background:#0d1117; border:1px solid var(--line); border-radius:6px; padding:6px 8px; }
  .log div { padding:2px 0; border-bottom:1px solid #161b22; white-space:pre-wrap; word-break:break-word; }
  .log .warn { color:var(--warn); } .log .error { color:var(--bad); } .log .host { color:var(--muted); }
  .secret { font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">App</h1>
    <span class="meta" id="version"></span>
    <span class="badge" id="status">loading</span>
    <span style="flex:1"></span>
    <span class="meta" id="size-label"></span>
  </header>
  <div class="stage" id="stage">
    <div class="screen" id="screen">
      <iframe id="frame" title="App" sandbox="allow-scripts allow-forms"></iframe>
      <div class="cover" id="cover">Starting…</div>
    </div>
  </div>
</main>
<aside>
  <h2>Screen</h2>
  <div class="row">
    <select id="size">
      <option value="1920x1080">1920 × 1080 (landscape)</option>
      <option value="1080x1920">1080 × 1920 (portrait)</option>
      <option value="1280x720">1280 × 720</option>
      <option value="3840x2160">3840 × 2160 (4K)</option>
      <option value="2400x480">2400 × 480 (banner)</option>
      <option value="800x600">800 × 600 (a zone)</option>
    </select>
    <label class="row" style="margin:0;flex:0 0 auto;gap:6px"><input type="checkbox" id="visible" checked> Visible</label>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="ghost" id="reload">Reload app</button>
    <button class="ghost" id="open">Open alone ↗</button>
  </div>

  <h2>Settings</h2>
  <form id="settings"></form>
  <p class="hint" id="settings-hint"></p>

  <h2>Send a message</h2>
  <textarea id="message">{ "ticket": "A042", "counter": 3 }</textarea>
  <div class="row" style="margin-top:8px"><button id="send">Send to the app</button></div>
  <p class="hint">What <code>POST /v1/apps/:id/messages</code> delivers to <code>wallcast.on('message')</code>.</p>

  <h2>Log</h2>
  <div class="log" id="log"></div>
</aside>
<script type="module" src="/__wallcast/host.js"></script>
</body>
</html>
